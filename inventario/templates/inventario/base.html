<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Tienda{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header>{% block header %}Mi Tienda{% endblock %}</header>
    <nav>
        <a href="{% url 'producto_list' %}">Productos</a>
        <a href="{% url 'producto_create' %}">Nuevo producto</a>
        <a href="{% url 'cliente_list' %}">Clientes</a>
        <a href="{% url 'venta_list' %}">Ventas</a>
        <a href="{% url 'venta_create' %}">Registrar venta</a>
    </nav>
    <main>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
